name: anImestream
description: An anime streaming client written in Flutter with iOS YouTube-style Picture-in-Picture.
publish_to: "none"
version: 1.0.1-beta.1+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  better_player: ^0.0.84
  provider: ^6.1.2
  dio: ^5.4.3+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
