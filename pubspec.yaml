name: animestream
description: An anime and manga client written in Flutter with Mangayomi-inspired JavaScript extensions and iOS Picture-in-Picture.
publish_to: "none"
version: 1.0.6+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  better_player:
    path: packages/better_player
  commentum_client:
    git:
      url: https://github.com/frostnova721/commentum_client
  provider: ^6.1.2
  dio: ^5.4.3+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  crypto: ^3.0.3

  # Core anImestream dependencies
  cached_network_image: ^3.3.1
  device_info_plus: ^10.1.0
  encrypt: ^5.0.3
  permission_handler: ^11.3.1
  flutter_secure_storage: ^9.0.0
  flutter_web_auth_2: ^3.1.2
  pull_to_refresh: ^2.0.0
  url_launcher: ^6.2.6
  flutter_svg: ^2.0.10+1
  file_picker: ^8.0.0
  app_links: ^6.1.1
  awesome_notifications: ^0.8.2
  desktop_webview_window: ^0.2.2
  dynamic_color: ^1.7.0
  window_manager: ^0.3.8
  fvp: ^0.23.0
  flutter_markdown_plus: ^0.7.3
  open_file: ^3.3.2
  video_player: ^2.8.5
  dart_discord_presence: ^0.1.3
  js_unpack: ^1.0.4
  http: ^1.2.0
  html: ^0.15.4
  path_provider: ^2.1.2
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/icons/
    - lib/assets/images/
