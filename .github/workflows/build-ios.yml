name: Build Unsigned iOS IPA

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Environment & Dependencies
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Static Analysis and Unit Tests
        run: |
          flutter analyze --no-fatal-infos lib/core/extensions lib/core/manga lib/ui/pages/manga test || true
          flutter test test/extension_system_test.dart test/manga_feature_test.dart

      - name: Build iOS App (Unsigned Release)
        run: |
          flutter build ios --no-codesign --release

      - name: Package Unsigned IPA for Sideloading
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r animestream-unsigned.ipa Payload
          ls -lh animestream-unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: animestream-unsigned-ipa
          path: animestream-unsigned.ipa
          if-no-files-found: error

      - name: Publish GitHub Release (On Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: animestream-unsigned.ipa
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
