name: Build Unsigned iOS IPA

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package Unsigned IPA
    # Keep the iOS SDK aligned with the known-good master build. macos-14
    # ships an older SDK that cannot compile device_info_plus 13.2.0.
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Check Environment & Dependencies
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Static Analysis and Unit Tests
        run: |
          flutter analyze --no-fatal-infos lib/core/extensions lib/core/manga lib/ui/pages/manga test || true
          flutter test test/extension_system_test.dart test/manga_feature_test.dart

      - name: Prepare iOS Release configuration
        run: |
          flutter build ios --config-only --no-codesign --release
          pod install --project-directory=ios

      - name: Build iOS App (Unsigned Release)
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          test -d build/ios/Build/Products/Release-iphoneos/Runner.app

      - name: Package Unsigned IPA for Sideloading
        run: |
          set -euo pipefail
          APP_PATH="build/ios/Build/Products/Release-iphoneos/Runner.app"
          rm -rf Payload animestream-unsigned.ipa
          mkdir -p Payload
          ditto "$APP_PATH" Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload animestream-unsigned.ipa
          unzip -tq animestream-unsigned.ipa
          ls -lh animestream-unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: animestream-unsigned-ipa
          path: animestream-unsigned.ipa
          if-no-files-found: error

      - name: Publish GitHub Release (On Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: animestream-unsigned.ipa
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
